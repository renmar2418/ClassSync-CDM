# Alembic configuration for ClassSync: AI-Powered University Classroom Scheduling, Availability Monitoring, and Conflict Detection System

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Sys.path prepends
prepend_sys_path = . packages/contracts-py

# Timezone for revision timestamps
timezone = UTC

# Max length of characters for the slug field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without .py files
sourceless = false

# Default database URL - overridden by DATABASE_URL environment variable in env.py
sqlalchemy.url = postgresql+psycopg://classync:classync@localhost:5432/classync_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
