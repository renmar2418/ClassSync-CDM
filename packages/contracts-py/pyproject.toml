[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "classync-contracts"
version = "1.0.0"
description = "ClassSync: AI-Powered University Classroom Scheduling, Availability Monitoring, and Conflict Detection System - Shared Python Contracts"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ClassSync Architecture Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "argon2-cffi>=23.1.0",
    "pyotp>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "alembic>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["classync_contracts*"]
