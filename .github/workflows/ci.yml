name: ClassSync CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Backend Microservices & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: |
          uv python install 3.12
          uv venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install Python Dependencies
        run: |
          uv pip install -e packages/contracts-py
          uv pip install -r services/gateway/requirements.txt
          uv pip install -r services/academic/requirements.txt
          uv pip install -r services/scheduling/requirements.txt
          uv pip install -r services/presence/requirements.txt
          uv pip install -r services/notification/requirements.txt
          uv pip install pytest pytest-asyncio anyio httpx python-multipart

      - name: Run Full Unit Test Suite
        env:
          JWT_SECRET_KEY: "classsync-zero-trust-hs256-production-secret-min32bytes!"
          TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
        run: |
          python -m pytest tests/unit/ -v

  build-frontend:
    name: Web Frontend Build & PWA Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Typecheck and Build Web Production Artifact
        run: pnpm --filter web build
